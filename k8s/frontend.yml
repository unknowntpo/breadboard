apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: breadboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: breadboard-frontend
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: breadboard
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
